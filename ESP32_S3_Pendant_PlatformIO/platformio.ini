[env:esp32-s3-supermini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 🔥 FORZA la dimensione flash a 4MB
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB

; 🔥 Usa un file CSV per le partizioni
board_build.partitions = partitions.csv

; Disabilita PSRAM se non presente o se dà problemi
; build_flags = 
;     -DBOARD_HAS_PSRAM=0

board_build.psram = enabled

build_flags =
    -DCONFIG_ESP_COREDUMP_ENABLE=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit SH110X
    adafruit/Adafruit ADS1X15
    adafruit/Adafruit GFX Library
    https://github.com/RobTillaart/PCF8575.git
    ; Aggiungi altre se necessarie